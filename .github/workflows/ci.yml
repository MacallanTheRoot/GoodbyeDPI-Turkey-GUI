name: Build and test
on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name GoodbyeDPI-Turkey --collect-all customtkinter
          --hidden-import pystray --hidden-import PIL._tkinter_finder
          --add-data "bin;bin" src/main.py
      - name: Build Linux directory
        if: runner.os == 'Linux'
        run: ./build_linux.sh
